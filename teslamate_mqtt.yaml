    - name: "Time To Full Charge"
      unique_id: "teslamate_3_time_to_full_charge"
      device:
        identifiers: ["teslamate_3"]
      state_topic: "teslamate/cars/3/time_to_full_charge"
      device_class: "duration"
      state_class: "measurement"
