# TeslaMate MQTT Sensors Configuration
# Modern Home Assistant MQTT Format (2024.6+)
# 
# Installation:
# 1. Save this file to: config/packages/teslamate_mqtt.yaml
# 2. Update car_id in ALL state_topic lines below (currently set to 3)
# 3. Add to configuration.yaml if not already:
#    homeassistant:
#      packages: !include_dir_named packages
# 4. Restart Home Assistant
#
# IMPORTANT: This file is configured for car_id=3 and device name "Black Magic"
# If your car ID is different, do a Find & Replace:
#   Find: teslamate/cars/3/
#   Replace with: teslamate/cars/YOUR_ID/
# Also update device name and model below if needed

mqtt:
  # ============================================
  # LOCATION & TRACKING
  # ============================================
  
  device_tracker:
    - name: "Location"
      unique_id: "teslamate_3_location"
      object_id: "black_magic_location"
      device:
        identifiers: ["teslamate_3"]
        name: "Black Magic"
        manufacturer: "Tesla"
        model: "Model Y Performance"
      state_topic: "teslamate/cars/3/latitude"
      json_attributes_topic: "teslamate/cars/3/location"
      icon: "mdi:crosshairs-gps"

  # ============================================
  # VEHICLE STATE
  # ============================================
  
  sensor:
    - name: "Display Name"
      unique_id: "teslamate_3_display_name"
      device:
        identifiers: ["teslamate_3"]
        name: "Black Magic"
        manufacturer: "Tesla"
        model: "Model Y Performance"
      state_topic: "teslamate/cars/3/display_name"
      icon: "mdi:car"
      
    - name: "State"
      unique_id: "teslamate_3_state"
      device:
        identifiers: ["teslamate_3"]
        name: "Black Magic"
        manufacturer: "Tesla"
        model: "Model Y Performance"
      state_topic: "teslamate/cars/3/state"
      icon: "mdi:car-connected"
      
    - name: "Since"
      unique_id: "teslamate_3_since"
      device:
        identifiers: ["teslamate_3"]
        name: "Black Magic"
        manufacturer: "Tesla"
        model: "Model Y Performance"
      state_topic: "teslamate/cars/3/since"
      device_class: "timestamp"
      icon: "mdi:clock-outline"
      
    - name: "Geofence"
      unique_id: "teslamate_3_geofence"
      device:
        identifiers: ["teslamate_3"]
        name: "Black Magic"
        manufacturer: "Tesla"
        model: "Model Y Performance"
      state_topic: "teslamate/cars/3/geofence"
      icon: "mdi:map-marker-radius"
      
    - name: "Shift State"
      unique_id: "teslamate_3_shift_state"
      device:
        identifiers: ["teslamate_3"]
        name: "Black Magic"
        manufacturer: "Tesla"
        model: "Model Y Performance"
      state_topic: "teslamate/cars/3/shift_state"
      icon: "mdi:car-shift-pattern"

  # ============================================
  # BATTERY & CHARGING
  # ============================================
  
    - name: "Battery Level"
      unique_id: "teslamate_3_battery_level"
      device:
        identifiers: ["teslamate_3"]
      state_topic: "teslamate/cars/3/battery_level"
      device_class: "battery"
      state_class: "measurement"
      unit_of_measurement: "%"
      icon: "mdi:battery"
      
    - name: "Usable Battery Level"
      unique_id: "teslamate_3_usable_battery_level"
      device:
        identifiers: ["teslamate_3"]
      state_topic: "teslamate/cars/3/usable_battery_level"
      device_class: "battery"
      state_class: "measurement"
      unit_of_measurement: "%"
      
    - name: "Charge Limit"
      unique_id: "teslamate_3_charge_limit_soc"
      device:
        identifiers: ["teslamate_3"]
      state_topic: "teslamate/cars/3/charge_limit_soc"
      state_class: "measurement"
      unit_of_measurement: "%"
      icon: "mdi:battery-charging-80"
      
    - name: "Estimated Range"
      unique_id: "teslamate_3_est_battery_range_km"
      device:
        identifiers: ["teslamate_3"]
      state_topic: "teslamate/cars/3/est_battery_range_km"
      device_class: "distance"
      state_class: "measurement"
      unit_of_measurement: "km"
