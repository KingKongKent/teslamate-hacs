        identifiers: ["teslamate_3"]
      state_topic: "teslamate/cars/3/spoiler_type"
      icon: "mdi:car-sports"

  # ============================================
  # BINARY SENSORS
  # ============================================
  
  binary_sensor:
    - name: "Plugged In"
      unique_id: "teslamate_3_plugged_in"
      device:
        identifiers: ["teslamate_3"]
      state_topic: "teslamate/cars/3/plugged_in"
      device_class: "plug"
      payload_on: "true"
      payload_off: "false"
      
    - name: "Charge Port Door"
      unique_id: "teslamate_3_charge_port_door_open"
